# Local dev stack: backend (SQLite) + frontend.  Run: docker compose up --build
# UI: http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/scrc.db
    volumes:
      - db-data:/data
      # Google OAuth token (created by python -m app.google_auth); kept out of the image.
      - ./backend/.secrets:/srv/backend/.secrets
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  db-data:
