<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Researchers</title>
</head>
<body>
  <main>
    <p><a href="/ui/">Home</a></p>
    <h1>Researchers</h1>

    <h2>Add researcher</h2>
    <form id="researcher-form">
      <p>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="255" required>
      </p>
      <p>
        <label for="orcid">ORCID</label>
        <input
          id="orcid"
          name="orcid"
          type="text"
          placeholder="0000-0000-0000-0000"
          pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]"
          maxlength="19"
          required
        >
      </p>
      <button type="submit">Add researcher</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>

    <h2>Directory</h2>
    <ul id="researchers" aria-live="polite"></ul>
  </main>

  <script>
    const form = document.querySelector("#researcher-form");
    const message = document.querySelector("#message");
    const directory = document.querySelector("#researchers");

    async function loadResearchers() {
      directory.replaceChildren(document.createTextNode("Loading researchers..."));
      try {
        const response = await fetch("/researchers");
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const researchers = await response.json();
        directory.replaceChildren();

        if (researchers.length === 0) {
          directory.append(document.createTextNode("No researchers have been added."));
          return;
        }

        for (const researcher of researchers) {
          const item = document.createElement("li");
          item.textContent = `${researcher.name} | ORCID: ${researcher.orcid} | ${researcher.is_active ? "Active" : "Inactive"}`;
          directory.append(item);
        }
      } catch (error) {
        directory.replaceChildren(document.createTextNode(`Could not load researchers: ${error.message}`));
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Adding researcher...";

      try {
        const response = await fetch("/researchers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: form.elements.name.value.trim(),
            orcid: form.elements.orcid.value.trim(),
          }),
        });

        if (!response.ok) {
          const error = await response.json();
          const detail = Array.isArray(error.detail)
            ? error.detail.map((item) => item.msg).join("; ")
            : error.detail;
          throw new Error(detail || `Request failed (${response.status})`);
        }

        form.reset();
        message.textContent = "Researcher added.";
        await loadResearchers();
      } catch (error) {
        message.textContent = `Could not add researcher: ${error.message}`;
      }
    });

    loadResearchers();
  </script>
</body>
</html>
