[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrc-backend"
version = "0.1.0"
description = "SCRC Impact Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pyodbc>=5.1,<6",
    "alembic>=1.13,<2",
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "email-validator>=2,<3",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx2",
]